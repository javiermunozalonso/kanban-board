[project]
name = "kanban-mcp"
version = "0.1.0"
description = "MCP Tool for Kanban Board API"
requires-python = ">=3.12,<3.14"
dependencies = ["mcp>=1.0.0", "httpx>=0.27.0"]

[project.scripts]
kanban-mcp = "kanban_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

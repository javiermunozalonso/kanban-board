services:
  backend-api:
    build:
      context: ./backend
    image: kanban-backend-api:local
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - kanban-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    image: kanban-frontend:local
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  mcp:
    profiles: ["mcp"]
    build:
      context: ./mcp-tool
    image: kanban-mcp:local
    environment:
      KANBAN_API_BASE: http://backend-api:8000/api
    depends_on:
      backend-api:
        condition: service_healthy
    stdin_open: true
    tty: false

volumes:
  kanban-data:
